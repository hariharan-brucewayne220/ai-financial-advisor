name: tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-core.txt
            backend/requirements-test.txt

      - name: Install core and test dependencies
        run: pip install -r requirements-core.txt -r requirements-test.txt

      - name: Run tests
        run: python -m pytest
